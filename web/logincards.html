<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
</head>
<body>
  <h2>Login</h2>
  <form id="loginForm">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br>
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>
    <button type="button" onclick="login()">Login</button>
  </form>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const response = await fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username, password })
      });

      const responseData = await response.json();

      if (response.ok) {
        localStorage.setItem('token', responseData.token); // Armazenar o token JWT no localStorage
        alert('Login Realizado com sucesso');

        // Após o login bem-sucedido, fazer uma requisição POST para a rota '/cards' com o token JWT
        const token = localStorage.getItem('token');
        const cardResponse = await fetch('http://localhost:3000/cards', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` // Incluir o token JWT no cabeçalho Authorization
          },
          body: JSON.stringify({}) // Não há necessidade de enviar um corpo para a requisição POST em '/cards'
        });

        // Verificar se a requisição para '/cards' foi bem-sucedida
        if (cardResponse.ok) {
          alert('Requisição para a rota "/cards" realizada com sucesso');
        } else {
          alert('Erro ao fazer a requisição para a rota "/cards"');
        }
      } else {
        alert(responseData.error); // Exibir uma mensagem de erro se o login falhar
      }
    }
  </script>
</body>
</html>
