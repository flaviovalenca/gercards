<body class="vh-100">
    <div class="authincation h-100">
        <div class="container h-100">
            <div class="row justify-content-center h-100 align-items-center">
                <div class="col-md-6">
                    <div class="authincation-content">
                        <div class="row no-gutters">
                            <div class="col-xl-12">
                                <div class="auth-form">
									<div class="brand-logo mb-3 text-center">
										<img class="logo-abbr dark-logo" width="230" src="./images/easbr.png" alt="">
                                        <!--<img class="logo-abbr dark-logo" width="200" src="./images/elcano.png" alt="">-->
										<img class="logo-abbr light-logo text-center m-auto" width="200" src="./images/logo-full-light.png" alt="">
									</div>
                                    <h4 class="text-center mb-4">Login</h4>
                                    <form action="javascript:logar();" id="formLogin">
                                        <input type="hidden" name="token" id="token" value="<%= GetToken() %>">										
                                        <div class="alert alert-danger alert-dismissible fade show" style="display:none" id="msgErro">
                                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="me-2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                                            <strong>Error!</strong> Verifique a senha e tente novamente.
                                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="btn-close">
                                            </button>
                                        </div>
                                        <div class="alert alert-danger alert-dismissible fade show" style="display:none" id="msgErroLoginDesativado">
                                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="me-2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                                            <strong>Este login está desativado.</strong> 
                                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="btn-close">
                                            </button>
                                        </div>
                                        <div class="alert alert-danger alert-dismissible fade show d-none" id="msgErroLoginSemAcessoAoBanco">
                                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="me-2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                                            <strong>Erro.</strong>  Problema de conexão com o banco.
                                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="btn-close">
                                            </button>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Login</label>
                                            <select class="default-select  form-control wide" id="selLoginNavio" required>																																																	
                                            </select>
                                            <div class="invalid-feedback">
                                                Selecione o navio.
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label><strong>Password</strong></label>
                                            <input type="password" id="btnPassword" class="form-control" value="" required>
                                            <a href="#" class="mostrarSenhaLink" onclick="mostrarloginSenha()">Mostrar Senha</a>
                                            <div class="invalid-feedback">
                                                Informe sua senha.
                                            </div>
                                        </div>
                                        <div class="text-center">
                                            <button type="button" id="btnEntrar" onclick="logar();" class="btn btn-primary btn-block">Entrar</button>
                                        </div>

                                        <hr class="my-4">
                                        
                                        <!-- Elemento original de copyright -->
                                        <div class="copyright">
                                            <p> Copyright © Designed 2023 &amp; Developed by <a class="text-primary" title="Siltech" target="_blank" href="https://siltecnologia.com/">Siltech </a></p>
                                        </div>

                                        <!-- Novo conteúdo adicionado antes do elemento de copyright -->
                                        <div class="new-account mt-3 text-center">
                                            <a class="text-primary" title="Siltech" target="_blank" href="https://siltecnologia.com/">
                                                <img src="images/logo_lgr.png" width="100px">
                                            </a>
                                        </div>

                                        
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
